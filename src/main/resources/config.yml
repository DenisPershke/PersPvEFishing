    weight_multiplier: 0.75
    common_chance: 90
    rare_chance: 9

captcha:
  enabled: false
  chance_percent: 10
  timeout_seconds: 25
  min_catches_between_checks: 15

rarities:
  common:
    display_name: "Обычная"
    color: "&f"
    chance: 70
    weight_min: 1.0
    weight_max: 3.0
    price_per_kg: 10
  rare:
    display_name: "Редкая"
    color: "&b"
    chance: 25
    weight_min: 2.0
    weight_max: 6.0
    price_per_kg: 40
  epic:
    display_name: "Эпическая"
    color: "&d"
    chance: 5
    weight_min: 5.0
    weight_max: 12.0
    price_per_kg: 150

rods:
  rod1:
    enabled: true
    display_name: "Удочка Рыбака"
    weight_bonus: 0.5
    bite_time_reduction: 0.0
    use_global_chances: true
  rod2:
    enabled: true
    display_name: "Удочка Мастера"
    weight_bonus: 1.0
    bite_time_reduction: 0.10
    use_global_chances: false
    chances:
      common: 60
      rare: 35
      epic: 5
  rod3:
    enabled: true
    display_name: "Океанская удочка"
    weight_bonus: 2.0
    bite_time_reduction: 0.20
    use_global_chances: false
    chances:
      common: 50
      rare: 40
      epic: 10

items:
  fish_name: "{rarity} рыба"
  fish_lore:
    - "&7Вес: {weight} кг"
    - "&7Цена: {price} монет"
  rod_lore:
    - "&7Бонус веса: +{weight_bonus} кг"
    - "&7Скорость поклёвки: -{bite_reduction_percent}%"
    - "&8ID: {rod_id}"

custom_fish:
  require_custom_model_data: true
  pdc_namespace: ""
  pdc_key: ""
  api_class: ""
  api_method: ""

