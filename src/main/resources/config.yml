  sold: "&aПродано рыб: {count}, получено: {price} монет."
  economy_error: "&cОшибка экономики: {error}"
  player_not_found: "&cИгрок не найден или не в сети."
  invalid_rod: "&cНеизвестная удочка. Доступно: {available_rods}"
  give_usage: "&eИспользование: /fish give <игрок> <rod_id>"
  stats_usage: "&eИспользование: /fish stats <игрок>"
  given_sender: "&aВы выдали {player}: {rod_id}"
  given_target: "&aВы получили {rod_name}"
  stats_header: "&6Статистика: &e{player}"
  stats_total: "&7Рыб поймано: &f{total_fish}"
  stats_biggest: "&7Самая большая: &f{biggest_fish} кг"
  stats_money: "&7Монет заработано: &f{money_earned}"
  top_header: "&6Топ рыбаков (по монетам):"
  top_empty: "&eТоп пуст."
  top_line: "&e{position}. &f{name} &7- {money} монет &8({fish_count} рыб)"
