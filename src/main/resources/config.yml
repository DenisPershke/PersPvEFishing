security:
  signing_secret: ""

top:
  size: 10

gameplay:
  catch_exp: 0
  vanilla_rod:
    # false = обычная ванильная удочка ловит только ванильный лут (как на ванилле),
    # кастомная рыба выпадает ТОЛЬКО со специальных удочек плагина.
    catch_custom_fish: false
    weight_multiplier: 0.75
    common_chance: 90
    rare_chance: 9

# Система уровней рыбалки.
# Уровень игрока определяется по количеству пойманной рыбы (fish_required).
# С каждым уровнем растёт:
#   weight_bonus    - сколько кг добавляется к пойманной рыбе;
#   luck_multiplier - множитель шанса редкой/эпической рыбы (удача), 1.0 = без изменений;
#   price_multiplier- множитель цены пойманной рыбы (зарплата), 1.0 = без изменений.
# По умолчанию: вес растёт с 1 уровня, удача — после 4-го, цена — после 8-го.
# Можно задать любое количество уровней — просто добавляйте/убирайте записи в tiers.
levels:
  enabled: true
  level_up_message: true
  tiers:
    1:
      fish_required: 0
      weight_bonus: 0.0
      luck_multiplier: 1.0
      price_multiplier: 1.0
    2:
      fish_required: 50
      weight_bonus: 0.2
      luck_multiplier: 1.0
      price_multiplier: 1.0
    3:
      fish_required: 150
      weight_bonus: 0.4
      luck_multiplier: 1.0
      price_multiplier: 1.0
    4:
      fish_required: 300
      weight_bonus: 0.6
      luck_multiplier: 1.0
      price_multiplier: 1.0
    5:
      fish_required: 500
      weight_bonus: 0.8
      luck_multiplier: 1.2
      price_multiplier: 1.0
    6:
      fish_required: 800
      weight_bonus: 1.0
      luck_multiplier: 1.4
      price_multiplier: 1.0
    7:
      fish_required: 1200
      weight_bonus: 1.2
      luck_multiplier: 1.6
      price_multiplier: 1.0
    8:
      fish_required: 1800
      weight_bonus: 1.4
      luck_multiplier: 1.8
      price_multiplier: 1.0
    9:
      fish_required: 2600
      weight_bonus: 1.7
      luck_multiplier: 2.0
      price_multiplier: 1.25
    10:
      fish_required: 4000
      weight_bonus: 2.0
      luck_multiplier: 2.5
      price_multiplier: 1.5

captcha:
  enabled: false
  chance_percent: 10
  timeout_seconds: 25
  min_catches_between_checks: 15

rarities:
  common:
    display_name: "Обычная"
    color: "&f"
    chance: 70
    weight_min: 1.0
    weight_max: 3.0
    price_per_kg: 10
  rare:
    display_name: "Редкая"
    color: "&b"
    chance: 25
    weight_min: 2.0
    weight_max: 6.0
    price_per_kg: 40
  epic:
    display_name: "Эпическая"
    color: "&d"
    chance: 5
    weight_min: 5.0
    weight_max: 12.0
    price_per_kg: 150

rods:
  rod1:
    enabled: true
    display_name: "Удочка Рыбака"
    weight_bonus: 0.5
    bite_time_reduction: 0.0
    use_global_chances: true
  rod2:
    enabled: true
    display_name: "Удочка Мастера"
    weight_bonus: 1.0
    bite_time_reduction: 0.10
    use_global_chances: false
    chances:
      common: 60
      rare: 35
      epic: 5
  rod3:
    enabled: true
    display_name: "Океанская удочка"
    weight_bonus: 2.0
    bite_time_reduction: 0.20
    use_global_chances: false
    chances:
      common: 50
      rare: 40
      epic: 10

items:
  fish_name: "{rarity} рыба"
  fish_lore:
    - "&7Вес: {weight} кг"
    - "&7Цена: {price} монет"
  rod_lore:
    - "&7Бонус веса: +{weight_bonus} кг"
    - "&7Скорость поклёвки: -{bite_reduction_percent}%"
    - "&8ID: {rod_id}"

custom_fish:
  require_custom_model_data: true
  pdc_namespace: ""
  pdc_key: ""
  api_class: ""
  api_method: ""

